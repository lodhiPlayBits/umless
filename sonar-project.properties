# SonarCloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# Check both keys on sonarcloud.io (your project → Information); change them here if they differ.
sonar.organization=lodhiplaybits
sonar.projectKey=lodhiPlayBits_umless
sonar.projectName=umless

sonar.sources=backend/app,backend/migrations,backup/backup.py,frontend/src
sonar.tests=backend/tests,backup/test_backup.py,frontend/src,frontend/tests
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/tests/**
sonar.exclusions=frontend/src/shared/api/generated/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
