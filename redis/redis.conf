# Redis config for umless. The password is set by docker-compose.yml (--requirepass).

# Reachable only on the umless Docker network (no published port), so listen on all
# container interfaces; the password still guards every connection.
bind 0.0.0.0
protected-mode yes
port 6379

# Memory: stay under the container's 256m limit. Evict least-recently-used keys that have
# a TTL, so cache entries go first and keys without one are never dropped.
maxmemory 128mb
maxmemory-policy volatile-lru

# Persistence: append-only file, fsync once a second, plus the default RDB snapshots.
appendonly yes
appendfsync everysec
dir /data

# Commands that can wipe or reconfigure the server are disabled.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""

loglevel notice
