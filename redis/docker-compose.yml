# Redis. Included by deploy/docker-compose.yml; can also be run on its own from this
# folder (`docker compose up -d`) to restart just Redis.
# Not published on the host: the backend reaches it as redis:6379 on the umless network.
name: umless

services:
  redis:
    image: redis:7.4-alpine
    container_name: umless-redis
    # REDIS_PASSWORD stays in the git-ignored redis/.env. Not the repo root's .env: that
    # holds the backend's secrets, which Redis has no use for.
    env_file:
      - path: .env
        required: false
    # The password is passed on the command line so it never sits in redis.conf.
    command: >
      sh -c 'test -n "$$REDIS_PASSWORD" || { echo "set REDIS_PASSWORD in .env" >&2; exit 1; };
      exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    # Keep in step with maxmemory in redis.conf (leave headroom for the AOF rewrite fork).
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - umless
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Append-only file and snapshots; survive rebuilds.
  redis-data:
    name: umless-redis-data

networks:
  umless:
    name: umless
