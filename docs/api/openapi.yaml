openapi: 3.1.0
info:
  title: umless API
  version: 1.0.0
  summary: Speech practice backend - questions and transcription.
  description: |
    Contract for umless (see docs/prd.md, docs/adr/0001-architecture.md and
    docs/adr/0003-clerk-auth.md). Every operation except getHealth needs a Clerk session
    token (`clerkSession`); each signed-in user sees only their own questions. A backend
    started without Clerk configured (local, single-user use) accepts calls without a token,
    and everyone is one local user. The server accepts only localhost Host headers (the
    public gateway sends one). Every non-2xx response uses the `Error` schema.
    `x-screen` on each operation names the screen actions from docs/design/screens.md it serves.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8000
    description: Local backend (the Vite dev server proxies /api here)
security:
  - clerkSession: []
tags:
  - name: health
    description: Server availability
  - name: questions
    description: The signed-in user's practice questions (MySQL, or a JSON file locally)
  - name: transcriptions
    description: Speech-to-text through Deepgram; the audio is never stored
  - name: billing
    description: Practice time (free minutes, then paid minutes) and Razorpay payments
  - name: takes
    description: The signed-in user's saved transcripts, per question (records in MySQL, transcripts in object storage)
  - name: client-errors
    description: Crash reports from the browser, so failures on the live site reach the server log

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check that the server is running
      description: |
        Called when `practice-ready` loads. A failure (network error or non-200) shows the
        banner "Server offline; you can record but not transcribe".
      x-screen:
        - practice-ready / health check on load
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List all questions in their stored order
      x-screen:
        - questions / list questions (on load)
        - questions-loading / list questions
        - questions-error / retry loading questions
        - questions / start practice
        - questions-deleted / start practice
        - practice-ready / load question by id from the list (direct URL, refresh), "2 of 5" position
        - result / next question
      description: |
        Returns the whole list (no pagination in v1), oldest first unless Undo re-inserted a
        question at an earlier position. The practice route also loads from this list: it finds
        the question by id (missing → `not-found`), and uses its index for "2 of 5" and for
        Next question, so one read serves the whole screen and can't disagree with itself.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: All questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionList'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Create a question
      description: |
        Appends the question, or inserts it at `position` (used by Undo after a delete).
        `text` is trimmed before it is stored. Duplicates are allowed; the client shows the
        duplicate warning itself.
      x-screen:
        - questions / create question
        - questions-empty / create question
        - questions-empty / add suggested question
        - questions-invalid / fix and create question, add anyway, retry save
        - questions-deleted / undo delete (with position)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreate'
            examples:
              append:
                summary: Add at the end
                value:
                  text: Tell me about yourself
              undo:
                summary: Undo a delete (re-insert at index 1)
                value:
                  text: Why do you want this job?
                  position: 1
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new question.
              required: true
              schema:
                type: string
                example: /api/questions/3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    patch:
      operationId: updateQuestion
      tags: [questions]
      summary: Change a question's text
      description: |
        `text` is trimmed before it is stored; `id`, `created_at` and position don't change.
        404 shows the toast "This question was deleted" and reloads the list.
      x-screen:
        - questions / update question (Save in inline edit)
        - questions-invalid / retry save (edit mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The updated question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete a question
      description: |
        Also deletes the question's saved takes (Undo brings back the question, not its takes).
        The client treats 404 as already deleted.
      x-screen:
        - delete-confirm / delete question
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/transcriptions:
    post:
      operationId: createTranscription
      tags: [transcriptions]
      summary: Transcribe a recording, keeping fillers and marking pauses
      description: |
        The request body is the raw audio from MediaRecorder (no multipart). Media type
        parameters such as `;codecs=opus` are allowed and ignored. Bodies over 25 MB
        (26,214,400 bytes) are rejected with 413 without reading the rest. The audio is sent to
        Deepgram nova-3 with `filler_words=true`, `smart_format=true`, `language=en` and
        `mip_opt_out=true`, and is not stored. Silence returns 200 with empty `text` and
        `words` (shown as `result-empty`).

        With `questionId`, the transcript is also saved as a take of that question (one of the
        signed-in user's questions, checked before Deepgram is called; otherwise 404) and the
        response's `take_id` names it. If saving fails the transcript is still returned, with
        `take_id: null`.

        On a metered server (getAccount `metered`), the server first measures the recording's
        length itself and refuses, before Deepgram is called, audio it can't read
        (`unreadable_audio`), recordings over 10 minutes (`recording_too_long`) and recordings
        longer than the user's free plus paid time left (402). The transcription then deducts
        exactly the measured length, rounded up to a second: free minutes first, then paid time.
        Recordings with no words are charged too (Deepgram bills them), except those under 15
        seconds, which is what a muted microphone looks like.

        Each user runs one transcription at a time (another while one runs: 409) and at most a
        set number each clock hour, 30 by default (over it: 429). Both are checked before
        Deepgram is called; a refused audio type doesn't count towards the hour.

        Free time also has a site-wide daily cap: all users together may use a set number of
        free minutes each India day, 600 by default. A recording that needs free time once the
        cap is used up gets 503 `free_time_paused` before Deepgram is called. Users whose paid
        time covers the whole recording are never refused and don't count towards the cap.
      x-screen:
        - practice-review / transcribe recording
        - practice-transcribe-error / retry transcription
      parameters:
        - name: questionId
          in: query
          required: false
          description: Save the transcript as a take of this question.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              $ref: '#/components/schemas/AudioBody'
          audio/ogg:
            schema:
              $ref: '#/components/schemas/AudioBody'
          audio/mp4:
            schema:
              $ref: '#/components/schemas/AudioBody'
          audio/wav:
            schema:
              $ref: '#/components/schemas/AudioBody'
          audio/mpeg:
            schema:
              $ref: '#/components/schemas/AudioBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The transcript with filler flags, pauses and a summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400':
          description: |
            The body was empty (`empty_audio`, shown as `practice-empty`); on a metered server the
            audio couldn't be read (`unreadable_audio`) or is over 10 minutes long
            (`recording_too_long`); or the Host header is not localhost/127.0.0.1 (`invalid_host`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: empty_audio
                detail: The recording is empty.
        '413':
          description: The body is larger than 25 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: audio_too_large
                detail: The recording is larger than 25 MB.
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '402':
          description: Not enough free or paid time left for this recording; `detail` says how long it is and how much is left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: payment_required
                detail: This recording is 6 min; you have 4 min left. Buy more practice time to transcribe it.
        '409':
          description: Another transcription of this user's is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: transcription_in_progress
                detail: Your other recording is still being transcribed. Wait for it to finish.
        '415':
          description: The Content-Type is missing or not one of the accepted audio types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unsupported_audio_type
                detail: Unsupported audio type. Send audio/webm, audio/ogg, audio/mp4, audio/wav or audio/mpeg.
        '429':
          description: The user has made this hour's maximum number of transcriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limited
                detail: You've made a lot of recordings this hour. Try again in a few minutes.
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Deepgram failed, timed out, or returned something unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: transcription_failed
                detail: Transcription failed. Try again in a moment.
        '503':
          description: |
            `transcription_unavailable`: the server has no DEEPGRAM_API_KEY (and is not in fake
            mode). `free_time_paused`: the recording needs free time and the site-wide daily cap
            on free time is used up; it resets at midnight India time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                transcriptionUnavailable:
                  value:
                    code: transcription_unavailable
                    detail: Transcription is unavailable because DEEPGRAM_API_KEY is not set.
                freeTimePaused:
                  value:
                    code: free_time_paused
                    detail: Free practice time is paused for today because a lot of people are using it. It's back after midnight, or buy a session to keep going now.

  /api/questions/{questionId}/takes:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      operationId: listTakes
      tags: [takes]
      summary: List a question's saved takes, newest first
      x-screen:
        - practice-ready / past takes (on load)
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The question's takes, newest first; each without its transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeList'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/takes:
    get:
      operationId: listAllTakes
      tags: [takes]
      summary: List saved takes across all questions, newest first
      description: >-
        The signed-in user's takes, optionally for one question and since a time, newest first and
        at most `limit`. An unknown questionId is a filter that matches nothing (an empty list),
        not a 404.
      x-screen:
        - history / all takes, one question's progress
        - dashboard / stats, chart, recent takes
      parameters:
        - name: questionId
          in: query
          required: false
          description: Only this question's takes.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            example: 3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
        - name: since
          in: query
          required: false
          description: Only takes saved at or after this time.
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'
        - name: limit
          in: query
          required: false
          description: The most takes to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The takes, newest first; each without its transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeList'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/takes/{takeId}:
    parameters:
      - $ref: '#/components/parameters/TakeId'
    get:
      operationId: getTake
      tags: [takes]
      summary: A saved take with its full transcript
      x-screen:
        - practice-ready / view past take
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The take and its transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Take'
        '404':
          $ref: '#/components/responses/TakeNotFound'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    delete:
      operationId: deleteTake
      tags: [takes]
      summary: Delete a saved take and its transcript
      x-screen:
        - practice-ready / delete past take
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/TakeNotFound'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/account:
    get:
      operationId: getAccount
      tags: [billing]
      summary: The signed-in user's practice time and the packs on sale
      x-screen:
        - header / practice time left
        - buy-time / pack choices
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The balance. On an unmetered server (local use) `metered` is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/payments:
    get:
      operationId: listPurchases
      tags: [billing]
      summary: The signed-in user's purchases, newest first
      description: >-
        Paid orders, including refunded ones and those with a refund in progress (a checkout
        that was opened and closed isn't a purchase). Each says whether it can be refunded now.
        Empty on a server without payments.
      x-screen:
        - settings-billing / purchases
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Purchases, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseList'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/payments/orders:
    post:
      operationId: createPaymentOrder
      tags: [billing]
      summary: Start buying a pack (creates a Razorpay order)
      description: |
        The amount comes from the server's price list, never from the client. The response has
        what Razorpay Checkout needs to open.
      x-screen:
        - buy-time / buy pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOrderCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: The order, ready for Checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PaymentProviderFailed'
        '503':
          $ref: '#/components/responses/PaymentsUnavailable'

  /api/payments/verify:
    post:
      operationId: verifyPayment
      tags: [billing]
      summary: Confirm a Checkout payment and add its time
      description: |
        Checks Razorpay's signature (HMAC-SHA256 of `order_id|payment_id` with the key secret),
        then asks Razorpay that the payment belongs to the order, has its amount and is captured
        (capturing an authorized one). Only then is the order's time credited, once; verifying a
        paid order again changes nothing.
      x-screen:
        - buy-time / payment succeeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerify'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The new balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The signature doesn't match or the payment isn't captured (`payment_invalid`), or a bad Host header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: payment_invalid
                detail: This payment couldn't be verified.
        '404':
          description: No order of the signed-in user has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: order_not_found
                detail: That payment order doesn't exist.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PaymentProviderFailed'
        '503':
          $ref: '#/components/responses/PaymentsUnavailable'

  /api/payments/{orderId}/refund:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Razorpay's order id, from listPurchases.
        schema:
          type: string
          minLength: 1
          maxLength: 64
          example: order_Tu3l5LvVnBJXfu
    post:
      operationId: requestRefund
      tags: [billing]
      summary: Refund an unused pack bought in the last 3 days
      description: |
        Self-serve refund under the published policy. Allowed when the purchase is `paid`, was
        paid within the last 3 days, and no paid practice time has been used since it was bought
        (using even one session of a 5-session pack ends the refund; free minutes don't
        count); `refundable` in listPurchases says the same. The pack's time
        is removed at once and Razorpay is asked to refund the full amount; the purchase is
        then `refund_pending` until Razorpay's `refund.processed` webhook makes it `refunded`
        (or `refund.failed` puts the time back and makes it `paid` again). No request body.
      x-screen:
        - settings-billing / purchases / request refund
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The purchase, now `refund_pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/InvalidHost'
        '404':
          description: No paid purchase of the signed-in user has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: order_not_found
                detail: That payment order doesn't exist.
        '409':
          description: |
            The policy doesn't allow it: already refunded or in progress, paid more than 3 days
            ago, or paid time has been used since it was bought. `detail` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: refund_not_allowed
                detail: This pack was bought more than 3 days ago, so it can't be refunded.
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Razorpay couldn't be reached or refused the refund; the time is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: payment_provider_failed
                detail: The refund couldn't be started. Your practice time is unchanged; try again later.
        '503':
          $ref: '#/components/responses/PaymentsUnavailable'

  /api/contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Send a complaint, suggestion or other message to umless
      description: |
        Emails the message to the umless inbox (through Resend), with the given email address as
        Reply-To so the reply goes straight to the sender. Plain text only. At most 5 messages per
        user per hour (429). Signed-out visitors use the email address on the Contact page instead.
      x-screen:
        - contact / send message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessage'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Sent.
        '400':
          $ref: '#/components/responses/InvalidHost'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many messages from this user this hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limited
                detail: You've sent a lot of messages this hour. Try again later, or email us.
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: The email provider couldn't be reached or refused the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: contact_failed
                detail: Your message couldn't be sent. Try again in a moment, or email us.
        '503':
          description: This server has no email provider set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: contact_unavailable
                detail: The contact form isn't set up on this server. Email us instead.

  /api/client-errors:
    post:
      operationId: reportClientError
      tags: [client-errors]
      summary: Report an error that happened in the browser
      description: |
        Sent by the frontend when a page crashes while rendering, when an error or rejected
        promise goes uncaught, or when the Content-Security-Policy reports a violation. The server writes the report to its log at ERROR (which alerts) and
        stores nothing. Sent only by signed-in users; signed-out pages keep errors in the console.
        The path has no query string. At most 30 reports per user per hour (429); the frontend
        also sends at most 5 per page load and skips repeats.
      x-screen:
        - every screen / crash or uncaught error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      responses:
        '204':
          description: Logged.
        '400':
          $ref: '#/components/responses/InvalidHost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many reports from this user this hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limited
                detail: Too many error reports this hour.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/payments/webhook:
    post:
      operationId: razorpayWebhook
      tags: [billing]
      summary: Razorpay's payment notification (server to server)
      description: |
        Called by Razorpay, not the browser, so it needs no sign-in: the
        `X-Razorpay-Signature` header (HMAC-SHA256 of the raw body with the webhook secret)
        proves it. `payment.captured` and `order.paid` credit a known order whose amount
        matches, once, and only while it is still unpaid (never a refunded one).
        `refund.processed` for the full amount makes the order `refunded` (taking its time back
        if the refund was started outside umless); `refund.failed` puts the time back and makes
        a `refund_pending` order `paid` again. Anything else is acknowledged and ignored.
      security: []
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: The signature is missing or wrong (`payment_invalid`), or a bad Host header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: payment_invalid
                detail: This payment couldn't be verified.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PaymentsUnavailable'

components:
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      description: The question's UUID. Anything that is not an existing id (malformed included) returns 404.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: 3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10

    TakeId:
      name: takeId
      in: path
      required: true
      description: The take's UUID. Anything that is not one of the user's takes returns 404.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: 7d1f0c3a-2b4e-4a6f-9c8d-1e2f3a4b5c6d

  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The Clerk session token from the frontend's `getToken()`, sent as
        `Authorization: Bearer <token>`. Verified with Clerk's published keys (RS256); its
        `sub` is the user id that owns the questions.

  responses:
    PaymentsUnavailable:
      description: This server has no Razorpay keys (or, for the webhook, no webhook secret).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: payments_unavailable
            detail: Payments aren't set up on this server.
    PaymentProviderFailed:
      description: Razorpay couldn't be reached or refused the order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: payment_provider_failed
            detail: The payment couldn't be started. Try again in a moment.
    TakeNotFound:
      description: No take of the signed-in user has this id (deleted, unknown or someone else's).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: take_not_found
            detail: That take doesn't exist any more.
    StorageUnavailable:
      description: Object storage couldn't be reached; nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: storage_unavailable
            detail: Your saved takes can't be reached right now. Try again in a moment.
    Unauthorized:
      description: No session token, or one that is invalid, expired or issued to another site.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            detail: Sign in to continue.
    InvalidHost:
      description: The Host header is not localhost or 127.0.0.1 (DNS-rebinding guard).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_host
            detail: Invalid Host header.
    QuestionNotFound:
      description: No question has this id (deleted, unknown or malformed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: question_not_found
            detail: That question doesn't exist any more.
    ValidationError:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            detail: Question text must be 500 characters or fewer.
            fields:
              - field: text
                message: Must be 500 characters or fewer (512 now).
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unsupported_media_type
            detail: Send the request body as application/json.
    InternalError:
      description: Unexpected server error. No internal details are included.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal_error
            detail: Something went wrong on the server.

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      example:
        status: ok

    Question:
      type: object
      additionalProperties: false
      required: [id, text, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned UUID v4.
        text:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: Trimmed; 1-500 Unicode code points.
        created_at:
          type: string
          format: date-time
          description: UTC, RFC 3339 with a `Z` suffix.
      example:
        id: 3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
        text: Tell me about yourself
        created_at: '2026-10-19T10:15:02Z'

    QuestionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Every question, in stored order.
          items:
            $ref: '#/components/schemas/Question'
      example:
        items:
          - id: 3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
            text: Tell me about yourself
            created_at: '2026-10-19T10:15:02Z'
          - id: 9b1e4d2a-77c3-4f8e-b0a6-5c3d2e1f0a98
            text: Why do you want this job?
            created_at: '2026-10-19T10:16:40Z'

    QuestionText:
      type: string
      minLength: 1
      maxLength: 500
      pattern: '\S'
      description: |
        At most 500 Unicode code points and at least one non-whitespace character. Leading and
        trailing whitespace is removed before storing; text that is empty after trimming is a 422.
      example: Tell me about yourself

    QuestionCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          $ref: '#/components/schemas/QuestionText'
        position:
          type: integer
          minimum: 0
          maximum: 100000
          description: |
            0-based index to insert at; values past the end append. Omit to append. Used by Undo
            to put a deleted question back where it was.
      example:
        text: Tell me about yourself

    QuestionUpdate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          $ref: '#/components/schemas/QuestionText'
      example:
        text: Tell me about yourself in two minutes

    AudioBody:
      type: string
      format: binary
      minLength: 1
      description: |
        Raw audio bytes, 1 byte to 25 MB (26,214,400 bytes). An empty body is a 400 `empty_audio`;
        a larger one is a 413 `audio_too_large`. The 25 MB cap isn't a `maxLength` keyword because
        test tools apply it to characters and can't generate a body that large.

    FillerWord:
      type: string
      enum: [um, uh, mhmm]
      description: |
        Words counted as fillers (Deepgram emits them with `filler_words=true`). Deepgram's
        uh-huh, uh-uh, mm-mm and nuh-uh are yes/no answers, so they count as ordinary words.
      example: um

    Word:
      type: object
      additionalProperties: false
      required: [word, punctuated_word, start, end, confidence, is_filler, pause_before_seconds]
      properties:
        word:
          type: string
          minLength: 1
          description: Lowercase, unpunctuated form from Deepgram.
        punctuated_word:
          type: string
          minLength: 1
          description: Display form with case and punctuation; equals `word` when Deepgram gives none.
        start:
          type: number
          minimum: 0
          maximum: 86400
          description: Seconds from the start of the audio.
        end:
          type: number
          minimum: 0
          maximum: 86400
          description: Seconds from the start of the audio; >= start.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        is_filler:
          type: boolean
          description: True when `word` is a FillerWord.
        pause_before_seconds:
          type: number
          minimum: 0
          maximum: 86400
          description: |
            Silence between the previous word's end and this word's start, floored at 0 and rounded
            to 0.01 s for display; 0 for the first word. Dots and the pause counts use the raw gap,
            not this rounded value: a raw gap g gives floor(g + 0.001) dots before this word.
      example:
        word: um
        punctuated_word: um,
        start: 2.4
        end: 2.7
        confidence: 0.95
        is_filler: true
        pause_before_seconds: 1.6

    FillerCount:
      type: object
      additionalProperties: false
      required: [word, count]
      properties:
        word:
          $ref: '#/components/schemas/FillerWord'
        count:
          type: integer
          minimum: 1
      example:
        word: um
        count: 4

    TranscriptSummary:
      type: object
      additionalProperties: false
      required:
        - word_count
        - filler_count
        - fillers
        - words_per_minute
        - fillers_per_minute
        - pause_count
        - longest_pause_seconds
      properties:
        word_count:
          type: integer
          minimum: 0
          description: Words that are not fillers.
        filler_count:
          type: integer
          minimum: 0
        fillers:
          type: array
          description: One entry per filler that occurred, sorted by count (desc), then word (asc).
          maxItems: 3
          items:
            $ref: '#/components/schemas/FillerCount'
        words_per_minute:
          type: [number, 'null']
          minimum: 0
          description: |
            word_count per minute, whole number. Minutes come from duration_seconds, or from the last
            word's end when duration_seconds is null or 0; null if neither is above 0.
        fillers_per_minute:
          type: [number, 'null']
          minimum: 0
          description: filler_count per minute, rounded to 0.1; same basis and null rule as words_per_minute.
        pause_count:
          type: integer
          minimum: 0
          description: Gaps between words that give at least one dot (raw gap g with floor(g + 0.001) >= 1).
        longest_pause_seconds:
          type: [number, 'null']
          minimum: 1
          maximum: 86400
          description: Longest such raw gap, rounded to 0.1; null when pause_count is 0.
      example:
        word_count: 212
        filler_count: 6
        fillers:
          - word: um
            count: 4
          - word: uh
            count: 2
        words_per_minute: 128
        fillers_per_minute: 3.6
        pause_count: 3
        longest_pause_seconds: 4.2

    Transcript:
      type: object
      additionalProperties: false
      required: [text, words, duration_seconds, summary]
      properties:
        text:
          type: string
          description: |
            Punctuated words joined by spaces, with N dots between two words separated by N full
            seconds of silence. Empty when no speech was detected.
        words:
          type: array
          items:
            $ref: '#/components/schemas/Word'
        duration_seconds:
          type: [number, 'null']
          minimum: 0
          description: Audio length reported by Deepgram; null if not reported.
        summary:
          $ref: '#/components/schemas/TranscriptSummary'
        take_id:
          type: [string, 'null']
          minLength: 1
          description: |
            Only in createTranscription responses sent with `questionId`: the saved take's id,
            or null if saving failed. Never part of a saved take's transcript.
      example:
        text: So, .. um, I led the migration.
        words:
          - word: so
            punctuated_word: So,
            start: 0.1
            end: 0.4
            confidence: 0.99
            is_filler: false
            pause_before_seconds: 0
          - word: um
            punctuated_word: um,
            start: 2.6
            end: 2.9
            confidence: 0.95
            is_filler: true
            pause_before_seconds: 2.2
          - word: i
            punctuated_word: I
            start: 3.0
            end: 3.1
            confidence: 0.98
            is_filler: false
            pause_before_seconds: 0.1
          - word: led
            punctuated_word: led
            start: 3.1
            end: 3.3
            confidence: 0.97
            is_filler: false
            pause_before_seconds: 0
          - word: the
            punctuated_word: the
            start: 3.3
            end: 3.4
            confidence: 0.99
            is_filler: false
            pause_before_seconds: 0
          - word: migration
            punctuated_word: migration.
            start: 3.4
            end: 4.0
            confidence: 0.96
            is_filler: false
            pause_before_seconds: 0
        duration_seconds: 4.5
        summary:
          word_count: 5
          filler_count: 1
          fillers:
            - word: um
              count: 1
          words_per_minute: 67
          fillers_per_minute: 13.3
          pause_count: 1
          longest_pause_seconds: 2.2

    TakeSummary:
      type: object
      additionalProperties: false
      required: [id, question_id, created_at, duration_seconds, summary]
      properties:
        id:
          type: string
          format: uuid
        question_id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
          description: When the take was saved, UTC.
        duration_seconds:
          type: [number, 'null']
          minimum: 0
        summary:
          $ref: '#/components/schemas/TranscriptSummary'
      example:
        id: 7d1f0c3a-2b4e-4a6f-9c8d-1e2f3a4b5c6d
        question_id: 3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
        created_at: '2026-10-25T10:15:02Z'
        duration_seconds: 4.5
        summary:
          word_count: 5
          filler_count: 1
          fillers:
            - word: um
              count: 1
          words_per_minute: 67
          fillers_per_minute: 13.3
          pause_count: 1
          longest_pause_seconds: 2.2

    TakeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/TakeSummary'

    Take:
      type: object
      additionalProperties: false
      required: [id, question_id, created_at, duration_seconds, summary, transcript]
      properties:
        id:
          type: string
          format: uuid
        question_id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        duration_seconds:
          type: [number, 'null']
          minimum: 0
        summary:
          $ref: '#/components/schemas/TranscriptSummary'
        transcript:
          $ref: '#/components/schemas/Transcript'

    Pack:
      type: object
      additionalProperties: false
      required: [id, label, seconds, amount_paise, currency]
      properties:
        id:
          type: string
          enum: [session_1, session_5]
        label:
          type: string
          minLength: 1
        seconds:
          type: integer
          minimum: 1
          description: Practice time the pack adds.
        amount_paise:
          type: integer
          minimum: 100
          description: Price in the currency's smallest unit (paise).
        currency:
          type: string
          enum: [INR]

    Account:
      type: object
      additionalProperties: false
      required: [metered, free_seconds_left, seconds_left, packs]
      properties:
        metered:
          type: boolean
          description: False on a server without payments (local use); then nothing is counted.
        free_seconds_left:
          type: integer
          minimum: 0
          description: Free practice time left (every account starts with 1200, i.e. 20 minutes); used before paid time.
        seconds_left:
          type: integer
          minimum: 0
          description: Paid practice time left.
        packs:
          type: array
          description: What can be bought; empty when not metered.
          items:
            $ref: '#/components/schemas/Pack'
      example:
        metered: true
        free_seconds_left: 0
        seconds_left: 3540
        packs:
          - id: session_1
            label: 1 session · 60 minutes
            seconds: 3600
            amount_paise: 4900
            currency: INR
          - id: session_5
            label: 5 sessions · 300 minutes
            seconds: 18000
            amount_paise: 19900
            currency: INR

    PaymentOrderCreate:
      type: object
      additionalProperties: false
      required: [pack_id]
      properties:
        pack_id:
          type: string
          enum: [session_1, session_5]

    Purchase:
      type: object
      additionalProperties: false
      required: [order_id, payment_id, pack_id, label, seconds, amount_paise, currency, paid_at, status, refundable]
      properties:
        order_id:
          type: string
          minLength: 1
          description: Razorpay's order id.
        payment_id:
          type: string
          minLength: 1
          description: Razorpay's payment id, as on the receipt; quote it to ask for a refund.
        pack_id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        seconds:
          type: integer
          minimum: 1
          description: Practice time it added.
        amount_paise:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
        paid_at:
          type: string
          format: date-time
          description: When the payment was confirmed, UTC.
        status:
          type: string
          enum: [paid, refund_pending, refunded]
          description: >-
            `refund_pending`: the time has been removed and Razorpay is returning the money;
            `refunded`: Razorpay has refunded it.
        refundable:
          type: boolean
          description: >-
            Whether requestRefund would accept it now: `paid`, paid within the last 3 days, and
            no paid time used since it was bought.
      example:
        order_id: order_Tu3l5LvVnBJXfu
        payment_id: pay_Tu3lhmtObPkSdy
        pack_id: session_1
        label: 1 session · 60 minutes
        seconds: 3600
        amount_paise: 4900
        currency: INR
        paid_at: '2026-10-30T08:50:46Z'
        status: paid
        refundable: true

    ContactMessage:
      type: object
      additionalProperties: false
      required: [kind, name, email, message]
      properties:
        kind:
          type: string
          enum: [complaint, suggestion, other]
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1f\x7f-\x9f]*[^\x00-\x20\x7f-\x9f][^\x00-\x1f\x7f-\x9f]*$'
          description: One line, no control characters, not blank.
        email:
          type: string
          maxLength: 254
          pattern: '^[A-Za-z0-9.!#$%&''*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+$'
          description: Where the reply goes (Reply-To). ASCII, name@domain.tld.
        message:
          type: string
          minLength: 10
          maxLength: 5000
      example:
        kind: suggestion
        name: Asha
        email: asha@example.com
        message: Could the summary also show how my pace changed over the week?

    ClientErrorReport:
      type: object
      additionalProperties: false
      required: [kind, message, path]
      properties:
        kind:
          type: string
          enum: [render, uncaught, rejection, csp]
          description: |
            `render`: a React render error (caught by an error boundary or not); `uncaught`: a
            window `error` event; `rejection`: an unhandled promise rejection; `csp`: something
            the Content-Security-Policy blocked, or would block while it is Report-Only (a
            `securitypolicyviolation` event; the message names the directive and the blocked
            origin or URL, without its query string).
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: The error's name and message, cut to 1000 characters.
        path:
          type: string
          maxLength: 500
          pattern: '^/'
          description: The page's pathname, without the query string or hash.
        stack:
          type: string
          maxLength: 10000
          description: The JavaScript stack trace, if there is one.
        component_stack:
          type: string
          maxLength: 10000
          description: React's component stack, for render errors.
      example:
        kind: render
        message: "TypeError: Cannot read properties of undefined (reading 'text')"
        path: /practice/3f2c8a9e-6b1d-4c0e-9a57-2d8e1f4b7c10
        stack: "TypeError: Cannot read properties of undefined (reading 'text')\n    at Transcript (index-abc123.js:1:2345)"
        component_stack: "\n    at Transcript\n    at PracticePage"

    PurchaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/Purchase'

    PaymentOrder:
      type: object
      additionalProperties: false
      required: [order_id, key_id, amount_paise, currency, pack_id, label]
      properties:
        order_id:
          type: string
          minLength: 1
          description: Razorpay's order id, for Checkout.
        key_id:
          type: string
          minLength: 1
          description: The public Razorpay key id, for Checkout.
        amount_paise:
          type: integer
          minimum: 100
        currency:
          type: string
          enum: [INR]
        pack_id:
          type: string
          enum: [session_1, session_5]
        label:
          type: string
          minLength: 1

    PaymentVerify:
      type: object
      additionalProperties: false
      required: [order_id, payment_id, signature]
      description: What Razorpay Checkout's success handler returns.
      properties:
        order_id:
          type: string
          minLength: 1
          maxLength: 64
        payment_id:
          type: string
          minLength: 1
          maxLength: 64
        signature:
          type: string
          minLength: 1
          maxLength: 256

    WebhookAck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ignored]

    ErrorCode:
      type: string
      enum:
        - validation_error
        - unsupported_media_type
        - question_not_found
        - take_not_found
        - order_not_found
        - payment_required
        - payment_invalid
        - payment_provider_failed
        - payments_unavailable
        - refund_not_allowed
        - unreadable_audio
        - recording_too_long
        - contact_unavailable
        - contact_failed
        - not_found
        - method_not_allowed
        - empty_audio
        - audio_too_large
        - unsupported_audio_type
        - transcription_failed
        - transcription_unavailable
        - transcription_in_progress
        - free_time_paused
        - rate_limited
        - storage_unavailable
        - invalid_host
        - unauthorized
        - internal_error
      description: |
        Stable machine-readable code. `not_found` and `method_not_allowed` are for unknown
        routes and wrong methods; the rest map to the documented responses.
      example: validation_error

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          minLength: 1
          description: Dotted path of the invalid input (`text`, `position`, `body`).
        message:
          type: string
          minLength: 1
      example:
        field: text
        message: Must be 500 characters or fewer (512 now).

    Error:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          minLength: 1
          description: One human-readable sentence. Never contains stack traces, paths or secrets.
        fields:
          type: array
          minItems: 1
          description: Present only when code is `validation_error`.
          items:
            $ref: '#/components/schemas/FieldError'
      example:
        code: question_not_found
        detail: That question doesn't exist any more.
