# Frontend (built Vite app served by a small nginx, see nginx.conf). Included by
# deploy/docker-compose.yml; can also be run on its own from this folder
# (`docker compose up -d --build`) to rebuild just the frontend.
# Not published on the host: the gateway reaches it as frontend:80 on the umless network.
name: umless

services:
  frontend:
    build: .
    image: umless-frontend
    container_name: umless-frontend
    # Static files only, so very little is needed.
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - umless
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  umless:
    name: umless
