# Static server for the built app, reached only through the gateway (deploy/nginx).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /practice/<id>) get index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
