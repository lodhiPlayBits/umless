# Whole stack: the nginx gateway + certbot here, the backend and frontend from their own
# compose files (tune each service there). Run from this folder:
#   docker compose up -d --build
# The gateway is the only service with published ports; backend and frontend are
# reachable only on the umless network, through the gateway's upstreams.
name: umless

include:
  - ../backend/docker-compose.yml
  - ../frontend/docker-compose.yml
  - ../redis/docker-compose.yml

services:
  nginx:
    build: ./nginx
    image: umless-gateway
    container_name: umless-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:?set SERVER_NAME in deploy/.env}
    volumes:
      - certbot-certs:/etc/nginx/ssl
      - certbot-webroot:/var/www/certbot
    # nginx resolves the upstream names at startup, so both must exist first.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    networks:
      - umless
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v3.1.0
    container_name: umless-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # No-op until init-letsencrypt.sh has issued a cert; then renews when due.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped
    logging: *logging

volumes:
  certbot-certs:
    name: umless-certbot-certs
  certbot-webroot:
    name: umless-certbot-webroot
