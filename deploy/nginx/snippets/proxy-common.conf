# The backend's DNS-rebinding guard accepts only localhost; nginx has already matched
# server_name, so it vouches for the request with a local Host.
proxy_set_header Host localhost;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# proxy_read_timeout / proxy_send_timeout are set per location (transcriptions need longer).
