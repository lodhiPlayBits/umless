# Repeated in any location that sets its own add_header (nginx doesn't merge them).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The practice screen records from the microphone, so this page may use it; nothing else may.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
# Report-Only first (launch roadmap, Phase 7): nothing is blocked; each violation shows in the
# browser console and, for signed-in users, reaches the backend log as a `csp` client error
# (src/shared/lib/reportError.ts). Rename to Content-Security-Policy once normal use is quiet.
#   clerk.umless.in: Clerk's script and API (the instance's custom domain); img.clerk.com: avatars;
#   challenges.cloudflare.com: Clerk's bot check (Turnstile);
#   checkout.razorpay.com / api.razorpay.com: Razorpay Checkout's script, frame and API;
#   blob: media, for replaying a recording; 'unsafe-inline' styles: Clerk injects <style> tags.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://clerk.umless.in https://challenges.cloudflare.com https://checkout.razorpay.com; connect-src 'self' https://clerk.umless.in https://api.razorpay.com https://lumberjack.razorpay.com; img-src 'self' data: https://img.clerk.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://challenges.cloudflare.com https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
