user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Questions are tiny; /api/transcriptions raises this to fit a 25 MB recording.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # General API traffic, per client IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Each transcription is a paid Deepgram call.
    limit_req_zone $binary_remote_addr zone=transcribe_limit:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
